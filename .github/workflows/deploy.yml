name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build
        env:
          VITE_FORM_SUBMIT_URL: ${{ secrets.VITE_FORM_SUBMIT_URL }}
          VITE_FORM_SUBMIT_SECRET: ${{ secrets.VITE_FORM_SUBMIT_SECRET }}
          CANONICAL_BASE: https://theonlypm.com
          SITE_BASE_PATH: /pm-website
        run: npm run build

      - name: Audit SEO
        run: npm run audit:seo
        env:
          CANONICAL_BASE: https://theonlypm.com
          SITE_BASE_PATH: /pm-website

      - name: Audit preview base paths
        run: npm run audit:preview-base
        env:
          CANONICAL_BASE: https://theonlypm.com
          SITE_BASE_PATH: /pm-website

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
